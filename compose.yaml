services:
  deepsearch:
    image: multimodal-image-search:local
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8080:8000"
    env_file:
      - .env
    volumes:
      - .:/app
    networks:
      - milvus

networks:
  milvus:
    external: true
    name: milvus
